# Builds standalone executables for Windows, macOS and Linux on every push, twice: the game for players, and
# "Avarenthia (test)" with the debug menu (F12) switched on, for testers.
# Download them from the run's "Artifacts" section on the Actions tab.
name: Build executables

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sep: ';'
            file: dist/Avarenthia.exe
            test: dist/AvarenthiaTest.exe
          - os: macos-latest
            sep: ':'
            file: dist/Avarenthia
            test: dist/AvarenthiaTest
          - os: ubuntu-latest
            sep: ':'
            file: dist/Avarenthia
            test: dist/AvarenthiaTest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Run headless tests
        run: python tests/test_headless.py
      - name: Build
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Avarenthia --add-data "assets${{ matrix.sep }}assets" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Avarenthia-${{ matrix.os }}
          path: ${{ matrix.file }}
      - name: Build the test build
        shell: bash
        run: |
          echo "The test build: the debug menu (F12) is on." > TESTBUILD
          pyinstaller --noconfirm --clean --onefile --windowed --name AvarenthiaTest --add-data "assets${{ matrix.sep }}assets" --add-data "TESTBUILD${{ matrix.sep }}." main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Avarenthia (test)-${{ matrix.os }}
          path: ${{ matrix.test }}
